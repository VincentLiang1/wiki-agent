.k1{stroke:#4493f8}.f1{fill:#4493f8}
.k2{stroke:#ab7df8}.f2{fill:#ab7df8}
.k3{stroke:#3fb950}.f3{fill:#3fb950}
.group{fill:#3fb950;fill-opacity:.07;stroke:#3fb950;stroke-opacity:.5}
}

.c1{color:#0969da}.c2{color:#8250df}.c3{color:#1a7f37}.cg{color:#59636e}
.eye{fill:#ffffff}
@media (prefers-color-scheme: dark){
.c1{color:#4493f8}.c2{color:#ab7df8}.c3{color:#3fb950}.cg{color:#9198a1}
.eye{fill:#151b23}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="head"/></marker>
