<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 590" width="760" height="590" role="img" aria-labelledby="title" xml:lang="zh-Hans" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',-apple-system,'Segoe UI',sans-serif">
<title id="title">会议助手全套服务架构</title>
<style>
.card{fill:#ffffff;stroke-width:1.5}
.folder{fill:none;stroke-width:1.5}
.t{fill:#1f2328;font-weight:600;font-size:16px}
.s{fill:#59636e;font-size:12.5px}
.lbl{fill:#59636e;font-size:12px}
.cap{font-weight:600;font-size:13px}
.line{stroke:#8c959f;stroke-width:1.6;fill:none}
.dash{stroke-dasharray:5 4}
.head{fill:#8c959f}
.k1{stroke:#0969da}.f1{fill:#0969da}
.k2{stroke:#8250df}.f2{fill:#8250df}
.k3{stroke:#1a7f37}.f3{fill:#1a7f37}
.group{fill:#1a7f37;fill-opacity:.05;stroke:#1a7f37;stroke-opacity:.45;stroke-width:1.2}
@media (prefers-color-scheme: dark){
.card{fill:#151b23}
.t{fill:#f0f6fc}
.s,.lbl{fill:#9198a1}
