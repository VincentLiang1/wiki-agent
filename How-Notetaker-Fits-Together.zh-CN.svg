<rect x="20" y="190" width="720" height="380" rx="16" class="group"/>
<text x="170.0" y="28" class="cap f1" text-anchor="middle">第 1 层：只要手机</text>
<text x="590.0" y="28" class="cap f2" text-anchor="middle">第 2 层：加上电脑版</text>
